<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>CS2 Demo Player</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="control-panel app-toolbar">
    <h2>CS2 Demo</h2>
    <div class="actions">
      <button id="btn-back-home" class="is-hidden" type="button">Home</button>
      <button id="btn-open" type="button">Import Demo</button>
      <button id="btn-parse-db" type="button" disabled>Parse</button>
      <span id="status-text">Ready</span>
    </div>
  </div>

  <div id="home-view" class="view home-shell-view">
    <div id="home-shell" class="home-shell">
      <aside id="home-nav" class="home-nav">
        <div class="home-nav-brand">
          <div class="home-nav-brand-mark">CS2</div>
          <div class="home-nav-brand-copy">
            <div class="home-nav-brand-title">Demo Player</div>
          </div>
          <button id="btn-home-nav-toggle" type="button" aria-label="Toggle navigation">Collapse</button>
        </div>
        <div id="home-nav-items" class="home-nav-items"></div>
      </aside>

      <section id="home-content" class="home-content">
        <section id="demo-library-page" class="home-page">
          <div class="page-shell demo-library-page-shell">
            <div class="page-header">
              <div class="page-header-copy">
                <h3>Demo</h3>
              </div>
              <div class="page-header-actions">
                <button id="btn-home-import-demo" type="button" class="page-action-button">Import Demo</button>
                <button id="btn-refresh-demos" type="button" class="page-action-button">Refresh</button>
              </div>
            </div>

            <div id="demo-library-summary" class="page-summary-strip is-hidden"></div>

            <aside class="library-panel home-library-panel">
              <div id="demo-list" class="demo-list">
                <div class="demo-empty">Import a demo to start.</div>
              </div>
              <div id="parse-job-progress" class="parse-job-progress is-hidden">
                <div class="parse-job-header">
                  <span id="parse-job-text">Idle</span>
                  <span id="parse-job-percent">0%</span>
                </div>
                <div class="parse-job-bar">
                  <div id="parse-job-bar-fill" class="parse-job-bar-fill"></div>
                </div>
                <div id="parse-job-meta" class="parse-job-meta">Waiting...</div>
              </div>
            </aside>
          </div>
        </section>

        <section id="hltv-local-library-page" class="home-page is-hidden">
          <div class="page-shell hltv-local-library-page-shell">
            <div class="page-header">
              <div class="page-header-copy">
                <h3>Library</h3>
              </div>
              <div class="page-header-actions">
                <button id="btn-local-library-refresh" type="button" class="page-action-button">刷新本地</button>
                <button id="btn-local-library-clear-all" type="button" class="page-action-button is-danger">清除全部</button>
                <button id="btn-local-library-open-hltv" type="button" class="page-action-button">去 HLTV 拉新</button>
              </div>
            </div>

            <div id="local-library-summary" class="page-summary-strip is-hidden"></div>
            <div id="local-library-status" class="hltv-status-panel is-hidden">加载中...</div>
            <div id="local-library-tab-list" class="entities-tab-list"></div>

            <section id="local-library-panel-matches" class="local-library-panel">
              <div class="local-library-filter-bar">
                <input id="local-library-match-search" class="entities-search-input" type="search" placeholder="搜索队伍、赛事、Match ID">
                <input id="local-library-map-search" class="entities-search-input" type="search" placeholder="地图：ancient / mirage">
                <label class="hltv-filter-toggle"><input id="local-library-filter-demo-only" type="checkbox"><span>有 demo</span></label>
                <label class="hltv-filter-toggle"><input id="local-library-filter-downloaded-only" type="checkbox"><span>已下载</span></label>
                <label class="hltv-filter-toggle"><input id="local-library-filter-parsed-only" type="checkbox"><span>已解析</span></label>
              </div>
              <div id="local-library-match-list" class="hltv-match-list"></div>
            </section>

            <section id="local-library-panel-teams" class="local-library-panel is-hidden">
              <div class="local-library-filter-bar">
                <input id="local-library-team-search" class="entities-search-input" type="search" placeholder="搜索战队">
              </div>
              <div id="local-library-team-list" class="entities-list"></div>
            </section>

            <section id="local-library-panel-players" class="local-library-panel is-hidden">
              <div class="local-library-filter-bar">
                <input id="local-library-player-search" class="entities-search-input" type="search" placeholder="搜索选手 / Player ID">
              </div>
              <div id="local-library-player-list" class="entities-list"></div>
            </section>
          </div>
        </section>

        <section id="playbook-page" class="home-page is-hidden">
          <div class="page-shell playbook-page-shell">
            <div class="page-header">
              <div class="page-header-copy">
                <h3>Playbook</h3>
              </div>
            </div>

            <div id="playbook-summary" class="page-summary-strip is-hidden"></div>
            <div id="playbook-status" class="hltv-status-panel is-hidden">加载中...</div>
            <div id="playbook-tab-list" class="entities-tab-list"></div>

            <section id="playbook-panel-maps" class="playbook-panel">
              <div id="playbook-map-grid" class="playbook-map-grid"></div>
            </section>

            <section id="playbook-panel-grenades" class="playbook-panel is-hidden">
              <div id="playbook-grenade-list" class="entities-list"></div>
            </section>
          </div>
        </section>

        <section id="hltv-page" class="home-page is-hidden">
          <div class="page-shell hltv-page-shell">
            <div class="page-header">
              <div class="page-header-copy">
                <h3>HLTV</h3>
              </div>
              <div class="page-header-actions">
                <button id="btn-hltv-refresh" type="button" class="page-action-button">刷新</button>
              </div>
            </div>

            <div id="hltv-status" class="hltv-status-panel is-hidden">刷新中...</div>
            <div id="hltv-cache-status" class="hltv-cache-status is-hidden"></div>

            <div class="hltv-results-layout">
              <section class="hltv-results-content">
                <div class="hltv-results-title-row">
                  <div>
                    <h4>Results</h4>
                    <div id="hltv-browse-summary" class="hltv-section-summary"></div>
                  </div>
                  <div class="hltv-results-toolbar">
                    <input
                      id="hltv-filter-search"
                      class="hltv-filter-input hltv-filter-inline"
                      type="search"
                      placeholder="搜索队伍、赛事、Match ID"
                    >
                    <label class="hltv-filter-toggle hltv-filter-inline-toggle">
                      <input id="hltv-filter-demo-only" type="checkbox">
                      <span>有 demo</span>
                    </label>
                    <button id="btn-hltv-search" class="hltv-filter-reset" type="button">搜索HLTV</button>
                    <button id="btn-hltv-reset-filters" class="hltv-filter-reset" type="button">重置</button>
                  </div>
                </div>
                <div id="hltv-match-list" class="hltv-match-list">
                  <div class="demo-empty">刷新后查看比赛。</div>
                </div>
              </section>
            </div>
          </div>
        </section>
      </section>
    </div>
  </div>

  <div id="replay-view" class="view is-hidden">
    <div class="replay-header">
      <h3 id="replay-title">Replay</h3>
    </div>
    <div class="replay-layout">
      <div class="canvas-container replay-canvas">
        <canvas id="radar-canvas" width="1600" height="900"></canvas>
      </div>
      <aside class="rounds-panel">
        <h3>Rounds</h3>
        <div id="round-list" class="round-list">
          <div class="round-empty">No rounds</div>
        </div>
        <section class="playbook-round-import-panel">
          <div class="playbook-round-import-header">
            <div>
              <div class="playbook-round-import-eyebrow">Playbook</div>
              <h4>投掷物候选</h4>
            </div>
            <button id="btn-playbook-import-grenades" type="button" disabled>导入选中</button>
          </div>
          <div id="playbook-round-grenade-status" class="playbook-round-grenade-status">加载回合后可查看投掷物候选。</div>
          <div id="playbook-round-grenade-candidates" class="playbook-round-grenade-candidates"></div>
        </section>
      </aside>
    </div>

    <div class="control-panel replay-controls">
      <div class="actions replay-actions">
        <button id="btn-play-toggle" type="button" disabled>Play</button>
        <input id="progress-bar" type="range" min="0" max="0" value="0" step="1" disabled>
        <span id="progress-text">0/0</span>
      </div>
    </div>
  </div>

  <div id="demo-context-menu" class="demo-context-menu is-hidden" role="menu" aria-label="Demo actions">
    <button id="demo-context-rename" class="demo-context-item" type="button" role="menuitem">Rename</button>
    <button id="demo-context-delete" class="demo-context-item danger" type="button" role="menuitem">Delete</button>
  </div>

  <script src="js/ui/home-shell-state-utils.js"></script>
  <script src="js/ui/core.js"></script>
  <script src="js/ui/home-shell.js"></script>
  <script src="js/ui/weapon-icons.js"></script>
  <script src="js/ui/round-playback-utils.js"></script>
  <script src="js/ui/team-side-lock-utils.js"></script>
  <script src="js/ui/team-panel-header-utils.js"></script>
  <script src="js/ui/hud-slot-layout-utils.js"></script>
  <script src="js/ui/demo-library-page-utils.js"></script>
  <script src="js/ui/playbook-page-utils.js"></script>
  <script src="js/ui/playbook-grenade-candidate-utils.js"></script>
  <script src="js/ui/hltv-local-library-page-utils.js"></script>
  <script src="js/ui/hltv-page-utils.js"></script>
  <script src="js/ui/hltv-results-view-utils.js"></script>
  <script src="js/ui/hltv-results-grouping-utils.js"></script>
  <script src="js/ui/library.js"></script>
  <script src="js/ui/hltv-local-library-page.js"></script>
  <script src="js/ui/playbook-page.js"></script>
  <script src="js/ui/hltv-page.js"></script>
  <script src="js/ui/hud.js"></script>
  <script src="js/ui/grenade-visual-utils.js"></script>
  <script src="js/ui/rendering.js"></script>
  <script src="js/ui/events.js"></script>
</body>
</html>
